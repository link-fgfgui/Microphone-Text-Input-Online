# jitpack build config for Microphone-Text-Input-Online.
#
# Goal: publish ONLY the root project's pure-Java SPI jar under the standard
# jitpack coordinates (com.github.link-fgfgui:Microphone-Text-Input-Online:<ver>),
# skipping the loom-based fabric/neoforge subprojects.
jdk:
  - openjdk21

before_install:
  - echo "Building mcmti SPI artifact only (root project, no loom)"

# Override the default `assemble publishToMavenLocal` so we publish ONLY the
# root project's spi publication. Loom subprojects publish to a `remapped.*`
# namespace that jitpack can't pick up, so they must be excluded.
install:
  - ./gradlew :publishToMavenLocal --no-daemon -xtest
