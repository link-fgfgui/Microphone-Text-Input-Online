plugins {
    id 'com.modrinth.minotaur'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

// Test sources provide a dedicated client integration fixture, not JVM unit tests.
tasks.named('test') {
    enabled = false
}

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    testCompileClasspath.extendsFrom common
    testRuntimeClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "maven.modrinth:midnightlib:${rootProject.midnightlib_version}-neoforge"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand "version": project.version,
               "neoforge_versionRange": project.neoforge_versionRange,
               "mc_versionRange": project.mc_versionRange
    }
}

tasks.named('runClient') {
    jvmArgs '-Djava.awt.headless=false'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    from(rootDir.toPath().toString() + "/LICENSE") {
        rename { "${it}_${rootProject.archives_name}"}
    }
    archiveFileName = "${rootProject.archives_name}-${rootProject.version}+${project.minecraft_version}-${project.name}.jar"
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = 'ynA13Vjn'
    versionNumber = rootProject.mod_version + "-neoforge"
    versionType = rootProject.getPublishVersionType()
    uploadFile = remapJar
    loaders = ["neoforge"]
    dependencies {
        required.project 'midnightlib'
    }
    changelog = rootProject.ext.publish_changelog
}
