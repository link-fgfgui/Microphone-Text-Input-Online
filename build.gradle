plugins {
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    // Root project publishes a pure-Java SPI jar (no minecraft/loom dependency)
    // so third-party plugin mods can compile against it via jitpack.
    id 'java-library'
    id 'maven-publish'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

project.ext.publish_changelog = {
    if (project.file('Changelog.md').exists()) {
        println('Found Changelog.md')
        return project.file('Changelog.md').text
    } else {
        println('Changelog.md not found, skipping changelog upload')
        return ''
    }
}()

ext.getPublishVersionType = {
    if (project.mod_version.contains("alpha")) {
        return 'alpha'
    } else if (project.mod_version.contains("rc") || project.mod_version.contains("beta")) {
        return 'beta'
    } else {
        return 'release'
    }
}

// ---------------------------------------------------------------------------
// SPI sourceSet: pure-Java ASR interfaces consumed by third-party plugin mods.
//
// These 6 files live in common/src/main/java but have NO minecraft dependency,
// so the root project compiles and publishes them WITHOUT loom. This keeps the
// artifact buildable on jitpack (loom would otherwise need MC mappings).
//
// Plugin mods compile against this root jar (compileOnly) but, at runtime, the
// same classes are loaded from the mcmti mod jar (common subproject compiles
// them from the same source). Plugin mods must NOT bundle these classes.
// ---------------------------------------------------------------------------
sourceSets {
    main {
        java {
            // Default src/main/java is empty; add only the SPI files.
            srcDir 'common/src/main/java'
            include 'me/jaffe2718/mcmti/asr/SpeechAsrClient.java'
            include 'me/jaffe2718/mcmti/asr/SpeechAsrClientPlugin.java'
            include 'me/jaffe2718/mcmti/asr/AsrConfig.java'
            include 'me/jaffe2718/mcmti/asr/AsrRequest.java'
            include 'me/jaffe2718/mcmti/asr/AsrResult.java'
            include 'me/jaffe2718/mcmti/asr/AsrException.java'
        }
    }
}

// Root jar includes ONLY the SPI classes — not the full mod (that lives in
// fabric/neoforge subprojects). The base archivesName from gradle.properties
// ('microphone-text-input-online') becomes the artifactId; jitpack overrides
// group/version via -Pgroup / -Pversion.
base {
    archivesName = rootProject.archives_name
}

// Publish the SPI artifact so jitpack can serve it under
// com.github.<user>:<repo>:<version>
publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
            // artifactId defaults to project name (= GitHub repo name on
            // jitpack). Do NOT override it — jitpack serves artifacts under
            // the GitHub repo name, regardless of archivesName.
        }
    }
}

// Root project needs the annotations dependency for the SPI sourceSet
// (subprojects declare it themselves, but the root project's main sourceSet
// does not inherit from them).
dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2'
}

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenLocal()
        maven {
            url = "https://api.modrinth.com/maven"
        }
    }

    dependencies {
        compileOnly 'org.jetbrains:annotations:26.0.2'
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        // mappings loom.officialMojangMappings()

        mappings loom.layered {
            it.mappings("net.fabricmc:yarn:$rootProject.yarn_mappings:v2")
            it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$rootProject.yarn_mappings_patch_neoforge_version")
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }
}
